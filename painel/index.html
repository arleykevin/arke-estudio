:root{
  --bg:#FBF1EA; --surface:#FFFFFF; --campo:#FDF8F4; --painel:#FFFAF6;
  --ink:#2E1B22; --muted:#8A7178; --faded:#C4B4AC; --line:#F0E2D8;
  --alert:#F23D5E; --atencao:#F2BD1D;
  --r-card:14px; --r-tile:16px; --r-col:20px; --r-campo:10px; --pill:999px;
  --sombra:0 1px 2px rgba(46,27,34,.04), 0 6px 16px -8px rgba(46,27,34,.14);
  --sombra-alta:0 2px 5px rgba(46,27,34,.05), 0 18px 32px -12px rgba(46,27,34,.22);
  --sans:"Duplet Rounded","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea,select{font:inherit}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px;border-radius:4px}
::placeholder{color:var(--faded)}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.oculto{display:none !important}
.truncar{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.wrap{max-width:1280px;margin:0 auto;padding:30px 20px 70px}

/* ---- rótulos ---- */
.rot{font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.12em;
     text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rot.ink{color:var(--ink)}
.pt{width:8px;height:8px;border-radius:var(--pill);flex:0 0 auto;display:inline-block}

/* ---- cabeçalho ---- */
.topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.topo h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.08;margin-top:7px}
.topo h1 .sep{color:var(--faded);margin:0 8px}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
.btn{font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
     border-radius:var(--pill);padding:11px 22px;transition:filter .15s}
.btn-cheio{background:var(--ink);color:var(--bg);box-shadow:var(--sombra)}
.btn-cheio:hover{filter:brightness(1.25)}
.btn-vazio{color:var(--muted)}
.btn-perigo{color:var(--alert);padding:11px 4px}

/* ---- métricas ---- */
.tiles{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.tile{flex:1 1 132px;min-width:132px;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--r-tile);padding:15px 18px 16px}
.tile .num{font-family:var(--mono);font-size:36px;line-height:1;font-weight:600;
           margin-top:10px;letter-spacing:-.02em}
.tile .num small{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:5px;font-weight:500}

/* ---- régua ---- */
.regua{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);
       padding:16px 18px 14px;margin-bottom:12px;overflow-x:auto}
.regua-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.regua-linha{display:flex;align-items:flex-end;gap:4px;min-width:620px}
.balde{display:flex;flex-direction:column;align-items:center;border-radius:var(--r-campo);
       padding:8px 10px;margin-right:8px;border:1px dashed var(--line)}
.balde.cheio{background:rgba(242,61,94,.1);border-color:rgba(242,61,94,.4)}
.dia{display:flex;flex-direction:column;align-items:center;flex:1;min-width:30px}
.dia.fds .marca{opacity:.4}
.pilha{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;justify-content:flex-start}
.pastilha{width:22px;height:10px;border-radius:var(--pill);border:none;padding:0;display:block;
          transition:transform .12s}
.pastilha:hover{transform:scale(1.18)}
.mais{font-family:var(--mono);font-size:9px;color:var(--muted)}
.marca{margin-top:8px;width:100%;padding:5px 0 4px;border-radius:var(--r-campo);
       display:flex;flex-direction:column;align-items:center}
.marca.hoje{background:var(--ink)}
.marca .n{font-family:var(--mono);font-size:12px;font-weight:600}
.marca .s{font-size:9px;font-weight:600;letter-spacing:.06em;color:var(--faded)}
.marca.hoje .n{color:var(--bg)}
.marca.hoje .s{color:rgba(251,241,234,.75)}

/* ---- filtros ---- */
.filtros{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:20px 0 14px}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;
      padding:9px 16px;border-radius:var(--pill);background:var(--surface);color:var(--ink);
      border:1.5px solid var(--line);transition:background .15s}
.chip .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .c{color:rgba(251,241,234,.7)}
.select-resp{font-size:12.5px;padding:9px 14px;border-radius:var(--pill);
             border:1.5px solid var(--line);background:var(--surface);color:var(--muted);outline:none}

/* ---- quadro ---- */
.quadro{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.quadro{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1080px){.quadro{grid-template-columns:repeat(4,1fr)}}
.coluna{background:var(--painel);border:1.5px solid var(--line);border-radius:var(--r-col);
        padding:11px;min-height:260px;transition:background .18s,border-color .18s}
.coluna.alvo{background:rgba(4,191,173,.07);border-style:dashed;border-color:var(--condizz,#04BFAD)}
.coluna-topo{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 12px}
.contador{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);
          background:rgba(46,27,34,.06);border-radius:var(--pill);padding:3px 9px}
.vazio-col{font-size:12.5px;color:var(--faded);padding:26px 10px;line-height:1.6;text-align:center}

/* ---- card ---- */
.card{background:var(--surface);border-radius:var(--r-card);border:1.5px solid var(--line);
      box-shadow:var(--sombra);padding:14px;margin-bottom:10px;cursor:pointer;
      transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--sombra-alta);transform:translateY(-2px)}
.card.atrasado{border-color:rgba(242,61,94,.55)}
.card.feito{opacity:.66}
.card.feito .titulo{text-decoration:line-through;text-decoration-color:var(--faded)}
.card-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
.selo{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pill);padding:4px 10px 4px 8px;max-width:100%}
.selo .seta{color:rgba(46,27,34,.3);font-size:10px}
.tag-alta{font-weight:700;font-size:9px;letter-spacing:.1em;color:var(--alert);
          background:rgba(242,61,94,.12);border-radius:var(--pill);padding:4px 8px;flex:0 0 auto}
.titulo{font-size:14.5px;font-weight:600;line-height:1.32}
.desc{font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:6px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-pe{display:flex;align-items:center;justify-content:space-between;margin-top:11px;gap:8px}
.dono{display:inline-flex;align-items:center;gap:6px;min-width:0;font-size:11.5px;color:var(--muted)}
.inicial{width:20px;height:20px;border-radius:var(--pill);background:rgba(46,27,34,.07);
         color:var(--ink);font-size:9.5px;font-weight:700;display:flex;align-items:center;
         justify-content:center;flex:0 0 auto}
.prazo{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
       font-weight:600;border-radius:var(--pill);color:var(--muted)}
.prazo .d{opacity:.65}
.prazo.quente{padding:3px 8px}
.prazo.tarde{background:rgba(242,61,94,.12);color:var(--alert)}
.prazo.perto{background:rgba(242,189,29,.2);color:#8A6A00}
.prazo.calmo,.prazo.sem{color:var(--faded);font-family:var(--sans)}
.barra{height:4px;background:var(--line);border-radius:var(--pill);margin-top:12px;overflow:hidden}
.barra span{display:block;height:4px;border-radius:var(--pill);transition:width .35s ease}

/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;
       overflow-y:auto;background:rgba(46,27,34,.44);backdrop-filter:blur(3px);padding:5vh 16px}
.folha{background:var(--surface);width:100%;max-width:640px;border-radius:var(--r-col);
       box-shadow:var(--sombra-alta);overflow:hidden}
.faixa{height:5px;transition:background .25s}
.folha-topo{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;
            border-bottom:1px solid var(--line)}
.fechar{font-size:15px;color:var(--muted);background:rgba(46,27,34,.05);border-radius:var(--pill);
        width:30px;height:30px}
.corpo{padding:24px}
.campo{display:block;margin-bottom:15px}
.campo .rot{display:block;margin-bottom:6px}
.campo input,.campo textarea,.campo select{width:100%;font-size:14px;color:var(--ink);
  background:var(--campo);border:1.5px solid var(--line);border-radius:var(--r-campo);
  padding:10px 12px;outline:none}
.campo input:focus,.campo textarea:focus,.campo select:focus{background:var(--surface);border-color:var(--ink)}
.campo textarea{min-height:76px;resize:vertical}
#f-titulo{font-size:16.5px;font-weight:600}
#f-previsao{font-family:var(--mono);font-size:13px}
#f-solucao.ativo{background:var(--surface);border-color:#04BFAD}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:520px){.tres{grid-template-columns:1fr}}
.folha-pe{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
          border-top:1px solid var(--line);background:var(--painel)}
.aviso{font-size:12.5px;color:var(--alert);background:rgba(242,61,94,.1);
       border:1px solid rgba(242,61,94,.3);border-radius:var(--r-campo);padding:11px 15px;margin-bottom:14px}
.rodape{font-size:11.5px;color:var(--faded);margin-top:30px}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo">
    <div>
      <span class="rot" id="data-hoje"></span>
      <h1 id="marca"></h1>
      <div class="sub">Ecossistema Cinthia França</div>
    </div>
    <button class="btn btn-cheio" id="btn-novo">+ Novo item</button>
  </div>

  <div class="aviso oculto" id="aviso"></div>
  <div class="tiles" id="tiles"></div>
  <div class="regua" id="regua"></div>
  <div class="filtros" id="filtros"></div>
  <div class="quadro" id="quadro"></div>
  <p class="rodape" id="rodape"></p>
</div>

<div class="modal oculto" id="modal">
  <div class="folha">
    <div class="faixa" id="f-faixa"></div>
    <div class="folha-topo">
      <span class="rot ink" id="f-modo">Novo item</span>
      <button class="fechar" id="f-fechar" aria-label="Fechar">&#10005;</button>
    </div>
    <div class="corpo">
      <label class="campo"><span class="rot">Título</span>
        <input id="f-titulo" placeholder="Resumo em uma linha"></label>
      <div class="dois">
        <label class="campo"><span class="rot">Operação</span>
          <select id="f-empresa"></select></label>
        <label class="campo"><span class="rot">Responsável</span>
          <input id="f-responsavel" placeholder="Quem toca"></label>
      </div>
      <label class="campo oculto" id="campo-ambiente"><span class="rot">Ambiente afetado</span>
        <select id="f-ambiente"></select></label>
      <label class="campo"><span class="rot">Problema — o que está travando</span>
        <textarea id="f-problema"></textarea></label>
      <label class="campo"><span class="rot">Plano de ação — como pretendemos resolver</span>
        <textarea id="f-plano"></textarea></label>
      <label class="campo"><span class="rot">Solução — o que de fato foi feito</span>
        <textarea id="f-solucao"></textarea></label>
      <div class="tres">
        <label class="campo"><span class="rot">Status</span><select id="f-status"></select></label>
        <label class="campo"><span class="rot">Prioridade</span><select id="f-prioridade"></select></label>
        <label class="campo"><span class="rot">Previsão</span><input type="date" id="f-previsao"></label>
      </div>
    </div>
    <div class="folha-pe">
      <button class="btn btn-perigo" id="f-excluir">Excluir</button>
      <div>
        <button class="btn btn-vazio" id="f-cancelar">Cancelar</button>
        <button class="btn btn-cheio" id="f-salvar">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   1. DADOS FIXOS
   ============================================================ */
const EMPRESAS = [
  { id:"arke",       nome:"ARKE",       cor:"#F24182", atende:"ETCF" },
  { id:"condizz",    nome:"Condizz",    cor:"#04BFAD", atende:null   },
  { id:"proposital", nome:"Proposi7al", cor:"#F2784B", atende:"ICF"  }
];
const AMBIENTES  = ["ETCF","ICF","ARKE","Proposi7al","Todos os ambientes"];
const COLUNAS    = [
  { id:"backlog",   nome:"Backlog" },
  { id:"execucao",  nome:"Em execução" },
  { id:"bloqueado", nome:"Bloqueado" },
  { id:"resolvido", nome:"Resolvido" }
];
const PRIORIDADES = [{id:"alta",nome:"Alta"},{id:"media",nome:"Média"},{id:"baixa",nome:"Baixa"}];
const SEMANA = ["D","S","T","Q","Q","S","S"];
const ALERTA = "#F23D5E", ATENCAO = "#F2BD1D", FADED = "#C4B4AC";

/* ============================================================
   2. PERSISTÊNCIA  — único ponto a trocar por um backend real
   ============================================================ */
const CHAVE = "painel:board:v1";
const Base = {
  compartilhada: typeof window.storage !== "undefined",
  async ler(){
    if(this.compartilhada){
      try{ const r = await window.storage.get(CHAVE, true);
           return r && r.value ? JSON.parse(r.value).itens || [] : []; }
      catch(e){ return []; }
    }
    try{ return JSON.parse(localStorage.getItem(CHAVE) || '{"itens":[]}').itens || []; }
    catch(e){ return []; }
  },
  async gravar(itens){
    const carga = JSON.stringify({ itens: itens });
    if(this.compartilhada) await window.storage.set(CHAVE, carga, true);
    else localStorage.setItem(CHAVE, carga);
  }
};

/* ============================================================
   3. UTILITÁRIOS
   ============================================================ */
const $  = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tint = (hex,a) => { const n = parseInt(hex.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; };
const uid = () => Math.random().toString(36).slice(2,10);
const empresaDe = id => EMPRESAS.find(e => e.id === id) || EMPRESAS[0];

const hojeISO = () => { const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const parseISO = s => { if(!s) return null; const p = s.split("-").map(Number);
  return (p[0] && p[1] && p[2]) ? new Date(p[0], p[1]-1, p[2]) : null; };
const diasEntre = (a,b) => Math.round((b-a)/86400000);
const diasAte = iso => { const a = parseISO(iso); return a ? diasEntre(parseISO(hojeISO()), a) : null; };
const fmtCurta = iso => { const d = parseISO(iso); return d
  ? String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0") : "\u2014"; };

function corEstado(it){
  if(it.status === "resolvido") return FADED;
  const d = diasAte(it.previsao);
  if(d === null) return empresaDe(it.empresa).cor;
  if(d < 0)  return ALERTA;
  if(d <= 2) return ATENCAO;
  return empresaDe(it.empresa).cor;
}
const novoItem = () => ({ id:uid(), empresa:"arke", ambiente:"", titulo:"", problema:"",
  plano:"", solucao:"", responsavel:"", prioridade:"media", previsao:"", conclusao:"",
  status:"backlog", criadoEm:hojeISO() });

/* ============================================================
   4. ESTADO
   ============================================================ */
let itens = [], filtroEmpresa = "todas", filtroResp = "todos", arrastado = null, edicao = null;

const visiveis = () => itens.filter(i =>
  (filtroEmpresa === "todas" || i.empresa === filtroEmpresa) &&
  (filtroResp === "todos" || i.responsavel === filtroResp));

async function persistir(){
  try{ await Base.gravar(itens); $("#aviso").classList.add("oculto"); }
  catch(e){
    $("#aviso").textContent = "N\u00e3o foi poss\u00edvel salvar. Sua \u00faltima altera\u00e7\u00e3o est\u00e1 s\u00f3 nesta tela.";
    $("#aviso").classList.remove("oculto");
  }
  desenhar();
}

/* ============================================================
   5. DESENHO
   ============================================================ */
function desenharMetricas(){
  const v = visiveis(), abertos = v.filter(i => i.status !== "resolvido");
  const conta = f => abertos.filter(f).length;
  const agora = new Date();
  const mes = agora.getFullYear()+"-"+String(agora.getMonth()+1).padStart(2,"0");
  const ciclos = v.filter(i => i.status === "resolvido" && i.conclusao && i.criadoEm)
                  .map(i => diasEntre(parseISO(i.criadoEm), parseISO(i.conclusao)));
  const medio = ciclos.length ? Math.round(ciclos.reduce((a,b)=>a+b,0)/ciclos.length) : null;

  const dados = [
    { rot:"Atrasados", val:conta(i => { const d = diasAte(i.previsao); return d !== null && d < 0; }), cor:ALERTA },
    { rot:"Pr\u00f3ximos 7 dias", val:conta(i => { const d = diasAte(i.previsao); return d !== null && d >= 0 && d <= 7; }) },
    { rot:"Bloqueados", val:conta(i => i.status === "bloqueado"), cor:ATENCAO },
    { rot:"Resolvidos no m\u00eas", val:v.filter(i => i.status === "resolvido" && (i.conclusao||"").indexOf(mes) === 0).length },
    { rot:"Ciclo m\u00e9dio", val:(medio === null ? "\u2014" : medio), suf:(medio === null ? "" : "dias") }
  ];

  $("#tiles").innerHTML = dados.map(d => {
    const aceso = d.cor && d.val > 0;
    const est = aceso ? 'style="background:'+tint(d.cor,.11)+';border-color:'+tint(d.cor,.28)+'"' : "";
    return '<div class="tile" '+est+'>'+
      '<span class="rot" style="color:'+(aceso ? d.cor : "var(--muted)")+'">'+esc(d.rot)+'</span>'+
      '<div class="num" style="color:'+(aceso ? d.cor : "var(--ink)")+'">'+esc(d.val)+
      (d.suf ? '<small>'+esc(d.suf)+'</small>' : "")+'</div></div>';
  }).join("");
}

function desenharRegua(){
  const abertos = visiveis().filter(i => i.status !== "resolvido" && i.previsao);
  const base = parseISO(hojeISO());
  const dias = [];
  for(let i = 0; i < 14; i++){
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate()+i);
    dias.push({ i:i, data:d, fds:(d.getDay() === 0 || d.getDay() === 6) });
  }
  const atrasados = abertos.filter(i => diasAte(i.previsao) < 0);
  const noDia = n => abertos.filter(i => diasAte(i.previsao) === n);
  const adiante = abertos.filter(i => diasAte(i.previsao) > 13).length;
  const pico = Math.max(1, atrasados.length, ...dias.map(d => noDia(d.i).length));

  const pilha = (lista, forcada) =>
    '<div class="pilha" style="min-height:'+(pico*13)+'px">'+
      lista.slice(0,6).map(it =>
        '<button class="pastilha" data-abrir="'+it.id+'" title="'+esc(it.titulo || "Sem t\u00edtulo")+
        ' \u00b7 '+esc(empresaDe(it.empresa).nome)+'" style="background:'+
        (forcada || empresaDe(it.empresa).cor)+'"></button>').join("")+
      (lista.length > 6 ? '<span class="mais">+'+(lista.length-6)+'</span>' : "")+
    '</div>';

  $("#regua").innerHTML =
    '<div class="regua-topo"><span class="rot ink">R\u00e9gua de prazos \u00b7 pr\u00f3ximos 14 dias</span>'+
    (adiante ? '<span class="rot">+'+adiante+' depois</span>' : "")+'</div>'+
    '<div class="regua-linha">'+
      '<div class="balde'+(atrasados.length ? " cheio" : "")+'">'+pilha(atrasados, ALERTA)+
        '<div style="margin-top:8px"><span class="rot" style="font-size:9px;color:'+
        (atrasados.length ? ALERTA : FADED)+'">atrasado</span></div></div>'+
      dias.map(d => {
        const hoje = d.i === 0;
        return '<div class="dia'+(d.fds ? " fds" : "")+'">'+pilha(noDia(d.i))+
          '<div class="marca'+(hoje ? " hoje" : "")+'">'+
            '<span class="n">'+d.data.getDate()+'</span>'+
            '<span class="s">'+(hoje ? "HOJE" : SEMANA[d.data.getDay()])+'</span>'+
          '</div></div>';
      }).join("")+
    '</div>';
}

function desenharFiltros(){
  const conta = id => itens.filter(i => i.status !== "resolvido" &&
    (id === "todas" || i.empresa === id)).length;
  const lista = [{ id:"todas", nome:"Todas", cor:null }].concat(EMPRESAS);
  const resp = [...new Set(itens.map(i => i.responsavel).filter(Boolean))].sort();

  $("#filtros").innerHTML =
    lista.map(e => '<button class="chip'+(filtroEmpresa === e.id ? " on" : "")+'" data-empresa="'+e.id+'">'+
      (e.cor ? '<span class="pt" style="background:'+e.cor+'"></span>' : "")+
      esc(e.nome)+'<span class="c">'+conta(e.id)+'</span></button>').join("")+
    (resp.length ? '<select class="select-resp" id="sel-resp"><option value="todos">Todos os respons\u00e1veis</option>'+
      resp.map(r => '<option'+(filtroResp === r ? " selected" : "")+'>'+esc(r)+'</option>').join("")+'</select>' : "");
}

function htmlCard(it){
  const emp = empresaDe(it.empresa);
  const escopo = emp.atende || it.ambiente;
  const d = diasAte(it.previsao);
  const feito = it.status === "resolvido";
  const atrasado = !feito && d !== null && d < 0;

  let prazo;
  if(feito) prazo = '<span class="prazo sem" style="font-family:var(--mono)">\u2713 '+fmtCurta(it.conclusao || it.previsao)+'</span>';
  else if(d === null) prazo = '<span class="prazo sem">sem prazo</span>';
  else {
    const cls = atrasado ? "quente tarde" : (d <= 2 ? "quente perto" : "calmo");
    prazo = '<span class="prazo '+cls+'">'+(d === 0 ? "hoje" : (atrasado ? "D+"+(-d) : "D-"+d))+
            '<span class="d">'+fmtCurta(it.previsao)+'</span></span>';
  }

  let barra = "";
  if(!feito && it.previsao){
    const ini = parseISO(it.criadoEm) || parseISO(hojeISO());
    const total = Math.max(diasEntre(ini, parseISO(it.previsao)), 1);
    const gasto = diasEntre(ini, parseISO(hojeISO()));
    const larg = gasto > total ? 100 : Math.max(3, Math.min(100, (gasto/total)*100));
    barra = '<div class="barra"><span style="width:'+larg+'%;background:'+corEstado(it)+'"></span></div>';
  }

  const dono = it.responsavel
    ? '<span class="inicial">'+esc(it.responsavel.trim().slice(0,2).toUpperCase())+'</span>'+
      '<span class="truncar">'+esc(it.responsavel)+'</span>'
    : '<span style="color:var(--faded)">sem dono</span>';

  return '<div class="card'+(atrasado ? " atrasado" : "")+(feito ? " feito" : "")+
    '" draggable="true" tabindex="0" role="button" data-id="'+it.id+'">'+
    '<div class="card-topo">'+
      '<span class="selo" style="background:'+tint(emp.cor,.13)+'">'+
        '<span class="pt" style="width:7px;height:7px;background:'+emp.cor+'"></span>'+
        '<span class="rot ink" style="font-size:10px">'+esc(emp.nome)+'</span>'+
        (escopo ? '<span class="seta">\u203a</span><span class="rot" style="font-size:10px;color:'+
          tint("#2E1B22",.62)+'">'+esc(escopo)+'</span>' : "")+
      '</span>'+
      (it.prioridade === "alta" && !feito ? '<span class="tag-alta">ALTA</span>' : "")+
    '</div>'+
    '<div class="titulo">'+esc(it.titulo || "Sem t\u00edtulo")+'</div>'+
    (it.problema ? '<div class="desc">'+esc(it.problema)+'</div>' : "")+
    '<div class="card-pe"><span class="dono">'+dono+'</span>'+prazo+'</div>'+
    barra+'</div>';
}

function desenharQuadro(){
  const v = visiveis();
  $("#quadro").innerHTML = COLUNAS.map(col => {
    const desta = v.filter(i => i.status === col.id)
      .sort((a,b) => (a.previsao || "9999").localeCompare(b.previsao || "9999"));
    return '<div class="coluna" data-col="'+col.id+'">'+
      '<div class="coluna-topo"><span class="rot ink">'+esc(col.nome)+'</span>'+
      '<span class="contador">'+desta.length+'</span></div>'+
      (desta.length ? desta.map(htmlCard).join("")
        : '<div class="vazio-col">'+(col.id === "backlog"
            ? "Arraste um card at\u00e9 aqui ou crie o primeiro item."
            : "Nada aqui.")+'</div>')+
    '</div>';
  }).join("");
}

function desenhar(){ desenharMetricas(); desenharRegua(); desenharFiltros(); desenharQuadro(); }

/* ============================================================
   6. MODAL
   ============================================================ */
function preencherSelects(){
  $("#f-empresa").innerHTML = EMPRESAS.map(e =>
    '<option value="'+e.id+'">'+esc(e.atende ? e.nome+" \u00b7 "+e.atende : e.nome)+'</option>').join("");
  $("#f-ambiente").innerHTML = '<option value="">Selecione o ambiente</option>'+
    AMBIENTES.map(a => '<option>'+esc(a)+'</option>').join("");
  $("#f-status").innerHTML = COLUNAS.map(c => '<option value="'+c.id+'">'+esc(c.nome)+'</option>').join("");
  $("#f-prioridade").innerHTML = PRIORIDADES.map(p => '<option value="'+p.id+'">'+esc(p.nome)+'</option>').join("");
}

function sincronizarModal(){
  const emp = empresaDe($("#f-empresa").value);
  $("#f-faixa").style.background = emp.cor;
  $("#campo-ambiente").classList.toggle("oculto", emp.id !== "condizz");
  $("#f-solucao").classList.toggle("ativo", $("#f-status").value === "resolvido");
  $("#f-solucao").placeholder = $("#f-status").value === "resolvido"
    ? "Registre o que resolveu \u2014 \u00e9 isso que fica no hist\u00f3rico"
    : "Preencher ao concluir";
}

function abrir(it){
  edicao = Object.assign({}, it);
  $("#f-modo").textContent = it.titulo ? "Editar item" : "Novo item";
  $("#f-titulo").value = it.titulo; $("#f-empresa").value = it.empresa;
  $("#f-ambiente").value = it.ambiente || ""; $("#f-responsavel").value = it.responsavel;
  $("#f-problema").value = it.problema; $("#f-plano").value = it.plano;
  $("#f-solucao").value = it.solucao; $("#f-status").value = it.status;
  $("#f-prioridade").value = it.prioridade; $("#f-previsao").value = it.previsao;
  sincronizarModal();
  $("#modal").classList.remove("oculto");
  $("#f-titulo").focus();
}
const fechar = () => { $("#modal").classList.add("oculto"); edicao = null; };

function salvar(){
  const emp = $("#f-empresa").value;
  const st  = $("#f-status").value;
  const it = Object.assign({}, edicao, {
    titulo: $("#f-titulo").value.trim() || "Sem t\u00edtulo",
    empresa: emp,
    ambiente: emp === "condizz" ? $("#f-ambiente").value : "",
    responsavel: $("#f-responsavel").value.trim(),
    problema: $("#f-problema").value, plano: $("#f-plano").value,
    solucao: $("#f-solucao").value, status: st,
    prioridade: $("#f-prioridade").value, previsao: $("#f-previsao").value,
    conclusao: st === "resolvido" ? (edicao.conclusao || hojeISO()) : ""
  });
  const i = itens.findIndex(x => x.id === it.id);
  if(i >= 0) itens[i] = it; else itens.push(it);
  fechar(); persistir();
}

/* ============================================================
   7. EVENTOS
   ============================================================ */
$("#btn-novo").onclick = () => abrir(Object.assign(novoItem(),
  { empresa: filtroEmpresa === "todas" ? "arke" : filtroEmpresa }));
$("#f-fechar").onclick = fechar;
$("#f-cancelar").onclick = fechar;
$("#f-salvar").onclick = salvar;
$("#f-excluir").onclick = () => { itens = itens.filter(x => x.id !== edicao.id); fechar(); persistir(); };
$("#f-empresa").onchange = sincronizarModal;
$("#f-status").onchange = sincronizarModal;
$("#modal").onmousedown = e => { if(e.target === $("#modal")) fechar(); };
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("#modal").classList.contains("oculto")) fechar();
});

$("#filtros").addEventListener("click", e => {
  const b = e.target.closest("[data-empresa]");
  if(b){ filtroEmpresa = b.dataset.empresa; desenhar(); }
});
$("#filtros").addEventListener("change", e => {
  if(e.target.id === "sel-resp"){ filtroResp = e.target.value; desenhar(); }
});
$("#regua").addEventListener("click", e => {
  const b = e.target.closest("[data-abrir]");
  if(b){ const it = itens.find(x => x.id === b.dataset.abrir); if(it) abrir(it); }
});

const quadro = $("#quadro");
quadro.addEventListener("click", e => {
  const c = e.target.closest(".card");
  if(c){ const it = itens.find(x => x.id === c.dataset.id); if(it) abrir(it); }
});
quadro.addEventListener("keydown", e => {
  const c = e.target.closest(".card");
  if(c && (e.key === "Enter" || e.key === " ")){ e.preventDefault();
    const it = itens.find(x => x.id === c.dataset.id); if(it) abrir(it); }
});
quadro.addEventListener("dragstart", e => {
  const c = e.target.closest(".card");
  if(c){ arrastado = c.dataset.id; e.dataTransfer.effectAllowed = "move"; }
});
quadro.addEventListener("dragover", e => {
  const col = e.target.closest(".coluna");
  if(col){ e.preventDefault();
    document.querySelectorAll(".coluna").forEach(x => x.classList.toggle("alvo", x === col)); }
});
quadro.addEventListener("dragleave", e => {
  const col = e.target.closest(".coluna");
  if(col && !col.contains(e.relatedTarget)) col.classList.remove("alvo");
});
quadro.addEventListener("drop", e => {
  const col = e.target.closest(".coluna");
  document.querySelectorAll(".coluna").forEach(x => x.classList.remove("alvo"));
  if(!col || !arrastado) return;
  e.preventDefault();
  const it = itens.find(x => x.id === arrastado);
  if(it){
    it.status = col.dataset.col;
    it.conclusao = it.status === "resolvido" ? (it.conclusao || hojeISO()) : "";
    persistir();
  }
  arrastado = null;
});

/* ============================================================
   8. PARTIDA
   ============================================================ */
(async function(){
  $("#data-hoje").textContent = "Painel de pend\u00eancias \u00b7 " + fmtCurta(hojeISO());
  $("#marca").innerHTML = EMPRESAS.map(e =>
    '<span style="color:'+e.cor+'">'+esc(e.nome)+'</span>').join('<span class="sep">/</span>');
  $("#rodape").textContent = Base.compartilhada
    ? "Base compartilhada \u00b7 todos que abrirem este painel veem e editam os mesmos itens"
    : "Base local \u00b7 os dados ficam neste navegador, nesta m\u00e1quina";
  preencherSelects();
  itens = await Base.ler();
  desenhar();
})();
</script>
</body>
</html>
